sensors:
  - gazebo_depth_camera

gazebo_depth_camera:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /camera_sensor/points
  max_range: 5.0
  point_subsample: 1
  padding_offset: 0.1
  padding_scale: 1.0
  max_update_rate: 2.0
  filtered_cloud_topic: filtered_cloud